# ปล่อยแพ็กเกจขึ้น npm ด้วย Trusted Publishing (OIDC)
#
# GitHub คุยกับ npm ตรง ๆ ผ่าน OIDC — ไม่มี token เก็บไว้ที่ไหนเลย
# ไม่มีวันหมดอายุ และไม่ต้องยืนยัน 2FA ทุกครั้งเหมือนตอน publish จากเครื่อง
#
# ⚠️ ชื่อไฟล์นี้ (publish.yml) ต้องตรงกับที่กรอกไว้ในหน้า Trusted Publisher
#    บน npmjs.com เป๊ะ ๆ ถ้าเปลี่ยนชื่อไฟล์ต้องไปแก้ฝั่ง npm ด้วย
#
# วิธีใช้: GitHub → แท็บ Actions → publish → Run workflow → เลือกแพ็กเกจ
# อย่าลืมขึ้นเวอร์ชันใน package.json แล้ว push ก่อน ไม่งั้น workflow จะหยุดให้เอง

name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: แพ็กเกจที่จะปล่อย
        required: true
        default: ui
        type: choice
        options:
          - ui
          - tokens

permissions:
  id-token: write # จำเป็นสำหรับ OIDC — ขาดตัวนี้แล้ว publish ไม่ผ่าน
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # ⚠️ ห้ามใส่ registry-url ที่นี่
      # setup-node จะสร้าง .npmrc ที่มี _authToken=${NODE_AUTH_TOKEN} ให้
      # พอไม่มี token ตัวแปรมันว่าง npm เลยเอา token ว่างไปยิงแทนที่จะขอ OIDC
      # แล้วโดนตอบ E404 (npm ใช้ 404 แทน 401 เวลา auth ไม่ผ่าน) — เจอมาแล้ว
      # ไม่ใส่ registry-url npm ก็ใช้ registry.npmjs.org เป็นค่าเริ่มต้นอยู่แล้ว
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # OIDC ต้องใช้ npm 11.5.1 ขึ้นไป Node 24 มาพร้อม npm 11 อยู่แล้ว
      # แต่ยึดให้ชัวร์ เพราะถ้าเก่ากว่านั้นมันจะไปหา token แทนแล้วพังแบบงง ๆ
      - name: อัปเดต npm ให้รองรับ OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - name: เช็คว่า OIDC พร้อมใช้จริง
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::ไม่มี OIDC token — เช็คว่า permissions.id-token เป็น write หรือยัง"
            exit 1
          fi
          echo "OIDC: พร้อม"
          echo "registry: $(npm config get registry)"
          UC=$(npm config get userconfig)
          if [ -f "$UC" ]; then
            echo "--- .npmrc ที่ npm เห็น (ซ่อนค่า) ---"
            sed 's/=.*/=<ซ่อน>/' "$UC"
          else
            echo ".npmrc: ไม่มี (ถูกแล้ว OIDC ไม่ต้องใช้)"
          fi

      - run: pnpm install --frozen-lockfile

      # ด่านเดียวกับเช็คลิสต์ใน PUBLISHING.md — build ไม่ผ่าน ห้ามปล่อย
      - run: pnpm build

      - name: กันปล่อยทับเวอร์ชันเดิม
        working-directory: packages/${{ inputs.package }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "กำลังจะปล่อย $NAME@$VERSION"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "::error::$NAME@$VERSION มีบน npm อยู่แล้ว — ขึ้นเวอร์ชันใน packages/${{ inputs.package }}/package.json แล้ว push ก่อน"
            exit 1
          fi

      - name: publish
        working-directory: packages/${{ inputs.package }}
        run: npm publish

      - name: สรุป
        working-directory: packages/${{ inputs.package }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "### ปล่อย \`$NAME@$VERSION\` แล้ว" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "https://www.npmjs.com/package/$NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "อย่าลืมอัปเดตบรรทัด \"เวอร์ชันล่าสุดที่ปล่อยแล้ว\" ใน PUBLISHING.md" >> $GITHUB_STEP_SUMMARY
